name: Corporate Production Deployment

# ============================================================
# CORPORATE-STYLE DEPLOYMENT PIPELINE
#
# GitHub
#    |
#    v
# Build + Validate
#    |
#    v
# Immutable Docker Artifact
#    |
#    v
# BETA
#    |
#    +--> Smoke Tests
#    +--> Health Check
#    |
#    v
# GAMMA
#    |
#    +--> Integration Tests
#    +--> Hydra / Load Tests
#    +--> Performance Gate
#    |
#    v
# Production Approval
#    |
#    v
# PROD
#    |
#    +--> Health Check
#    +--> Post Deployment Verification
#    |
#    +--> Failure -> Rollback
#
# ============================================================

on:

  # Normal deployment
  push:
    branches:
      - main

  # Allows you to manually start a deployment
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (leave empty for automatic version)"
        required: false
        type: string


# ============================================================
# GLOBAL CONFIGURATION
# ============================================================

env:

  APP_NAME: autonomous-sre-finops-agent

  REGISTRY: ghcr.io

  IMAGE_NAME: supriyadutta167/autonomous-sre-finops-agent


# ============================================================
# CONCURRENCY
#
# Prevent two production deployments from running at the
# same time.
# ============================================================

concurrency:

  group: production-deployment

  cancel-in-progress: false


# ============================================================
# 1. BUILD + VALIDATION
# ============================================================

jobs:

  build:

    name: "🏗️ Build & Validate"

    runs-on: ubuntu-latest

    outputs:

      version: ${{ steps.version.outputs.version }}

      image: ${{ steps.image.outputs.image }}

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout repository

        uses: actions/checkout@v4


      # --------------------------------------------------------
      # VERSION
      #
      # Every deployment receives an immutable version.
      #
      # Example:
      #
      # v1.0.42
      #
      # --------------------------------------------------------

      - name: Generate deployment version

        id: version

        shell: bash

        run: |

          if [ -n "${{ inputs.version }}" ]; then

            VERSION="${{ inputs.version }}"

          else

            VERSION="v1.0.${GITHUB_RUN_NUMBER}"

          fi

          echo "Deployment version: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------------
      # SETUP NODE
      #
      # Remove this section if your backend isn't Node.
      # --------------------------------------------------------

      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: 20

          cache: npm


      # --------------------------------------------------------
      # INSTALL
      # --------------------------------------------------------

      - name: Install dependencies

        run: npm ci


      # --------------------------------------------------------
      # LINT
      # --------------------------------------------------------

      - name: Lint

        run: npm run lint --if-present


      # --------------------------------------------------------
      # UNIT TESTS
      # --------------------------------------------------------

      - name: Unit tests

        run: npm test --if-present


      # --------------------------------------------------------
      # SECURITY
      # --------------------------------------------------------

      - name: Dependency security scan

        run: |

          npm audit \
            --audit-level=high


      # ========================================================
      # DOCKER
      # ========================================================

      - name: Login to GitHub Container Registry

        uses: docker/login-action@v3

        with:

          registry: ${{ env.REGISTRY }}

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------------------------
      # IMAGE NAME
      # --------------------------------------------------------

      - name: Generate image name

        id: image

        shell: bash

        run: |

          IMAGE="${REGISTRY}/${IMAGE_NAME}:${{ steps.version.outputs.version }}"

          echo "Docker image:"
          echo "$IMAGE"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------------
      # BUILD IMAGE
      # --------------------------------------------------------

      - name: Build Docker image

        run: |

          docker build \
            --tag "${{ steps.image.outputs.image }}" \
            .


      # --------------------------------------------------------
      # PUSH IMAGE
      #
      # IMPORTANT:
      #
      # This artifact will be promoted through Beta -> Gamma
      # -> Production.
      #
      # We do NOT rebuild at every environment.
      # --------------------------------------------------------

      - name: Push immutable artifact

        run: |

          docker push \
            "${{ steps.image.outputs.image }}"


# ============================================================
# 2. BETA DEPLOYMENT
# ============================================================

  beta:

    name: "🟢 Beta Deployment"

    needs: build

    runs-on: ubuntu-latest

    environment:

      name: beta

    steps:

      - name: Checkout

        uses: actions/checkout@v4


      # --------------------------------------------------------
      # DEPLOY
      # --------------------------------------------------------

      - name: Deploy application

        run: |

          echo "======================================"
          echo "        BETA DEPLOYMENT"
          echo "======================================"

          echo "Application:"
          echo "${APP_NAME}"

          echo ""

          echo "Version:"
          echo "${{ needs.build.outputs.version }}"

          echo ""

          echo "Artifact:"
          echo "${{ needs.build.outputs.image }}"

          echo ""

          echo "Deploying immutable artifact..."

          # Replace this section with your actual deployment:
          #
          # docker compose -f docker-compose.beta.yml up -d
          #
          # OR
          #
          # kubectl set image deployment/app \
          # app=${{ needs.build.outputs.image }}


      # --------------------------------------------------------
      # WAIT FOR STARTUP
      # --------------------------------------------------------

      - name: Wait for application startup

        run: |

          echo "Waiting for Beta..."

          sleep 10


      # --------------------------------------------------------
      # HEALTH CHECK
      # --------------------------------------------------------

      - name: Beta health check

        run: |

          echo "Checking Beta health..."

          # Example:
          #
          # curl --fail \
          # https://beta.example.com/health

          echo "Beta health check passed."


# ============================================================
# 3. BETA TESTS
# ============================================================

  beta-tests:

    name: "🧪 Beta Smoke Tests"

    needs: beta

    runs-on: ubuntu-latest

    steps:

      - name: Smoke test API

        run: |

          echo "Running Beta smoke tests..."

          # Example:
          #
          # curl --fail \
          # https://beta.example.com/api/health

          echo "API responding."


      - name: Validate critical endpoints

        run: |

          echo "Testing critical endpoints..."

          # Add your real endpoint tests here.


      - name: Beta gate

        run: |

          echo "================================"
          echo "BETA GATE PASSED ✓"
          echo "================================"


# ============================================================
# 4. GAMMA DEPLOYMENT
# ============================================================

  gamma:

    name: "🟡 Gamma Deployment"

    needs: beta-tests

    runs-on: ubuntu-latest

    environment:

      name: gamma

    steps:

      - name: Checkout

        uses: actions/checkout@v4


      # --------------------------------------------------------
      # PROMOTE SAME ARTIFACT
      # --------------------------------------------------------

      - name: Promote artifact to Gamma

        run: |

          echo "======================================"
          echo "        GAMMA DEPLOYMENT"
          echo "======================================"

          echo "Application:"
          echo "${APP_NAME}"

          echo ""

          echo "Promoting artifact:"
          echo "${{ needs.build.outputs.image }}"

          echo ""

          echo "IMPORTANT:"
          echo "This artifact was already tested in Beta."

          # Actual deployment goes here.


      - name: Wait for Gamma

        run: |

          sleep 10


      - name: Gamma health check

        run: |

          echo "Checking Gamma health..."

          # curl --fail \
          # https://gamma.example.com/health

          echo "Gamma is healthy."


# ============================================================
# 5. INTEGRATION TESTS
# ============================================================

  integration-tests:

    name: "🔗 Integration Tests"

    needs: gamma

    runs-on: ubuntu-latest

    steps:

      - name: Checkout

        uses: actions/checkout@v4


      - name: Install dependencies

        run: npm ci


      - name: Integration tests

        run: |

          echo "======================================"
          echo "       INTEGRATION TESTS"
          echo "======================================"

          # Replace with:
          #
          # npm run test:integration

          echo "Testing:"
          echo "Application -> Database"
          echo "Application -> APIs"
          echo "Application -> Queue"
          echo "Application -> External services"

          echo ""

          echo "Integration tests passed ✓"


# ============================================================
# 6. HYDRA TESTS
#
# This is the performance / stress testing stage.
#
# You can eventually replace this with k6, Locust, JMeter,
# or your own Hydra engine.
# ============================================================

  hydra-tests:

    name: "🐉 Hydra / Load Tests"

    needs: integration-tests

    runs-on: ubuntu-latest

    steps:

      - name: Install k6

        uses: grafana/setup-k6-action@v1


      - name: Run Hydra load test

        run: |

          echo "======================================"
          echo "          HYDRA TESTING"
          echo "======================================"

          echo "Target environment: GAMMA"

          echo ""

          echo "Traffic profile:"
          echo "Users: 1000"
          echo "Requests: 10000"

          echo ""

          # When your load test exists:
          #
          # k6 run tests/hydra.js


      # --------------------------------------------------------
      # PERFORMANCE GATE
      # --------------------------------------------------------

      - name: Hydra performance gate

        shell: bash

        run: |

          ERROR_RATE=0.2

          P95_LATENCY=180

          MAX_ERROR_RATE=1

          MAX_P95_LATENCY=500


          echo "Error rate: ${ERROR_RATE}%"

          echo "P95 latency: ${P95_LATENCY}ms"


          if (( $(echo "$ERROR_RATE > $MAX_ERROR_RATE" | bc -l) )); then

            echo "❌ Hydra error-rate gate FAILED"

            exit 1

          fi


          if (( P95_LATENCY > MAX_P95_LATENCY )); then

            echo "❌ Hydra latency gate FAILED"

            exit 1

          fi


          echo ""

          echo "======================================"

          echo "       HYDRA GATE PASSED ✓"

          echo "======================================"


# ============================================================
# 7. PRODUCTION DEPLOYMENT
#
# Configure the GitHub "production" environment with
# Required Reviewers.
#
# That creates:
#
# Hydra
#    ↓
# Approval
#    ↓
# Production
# ============================================================

  production:

    name: "🔴 Production Deployment"

    needs: hydra-tests

    runs-on: ubuntu-latest

    environment:

      name: production

    steps:

      - name: Checkout

        uses: actions/checkout@v4


      - name: Production deployment

        run: |

          echo "======================================"

          echo "       PRODUCTION DEPLOYMENT"

          echo "======================================"


          echo "Application:"
          echo "${APP_NAME}"


          echo ""

          echo "Version:"
          echo "${{ needs.build.outputs.version }}"


          echo ""

          echo "Artifact:"
          echo "${{ needs.build.outputs.image }}"


          echo ""

          echo "Deploying..."

          # ACTUAL PRODUCTION DEPLOYMENT
          #
          # Example:
          #
          # kubectl set image deployment/app \
          # app=${{ needs.build.outputs.image }}


      - name: Wait for production

        run: |

          echo "Waiting for production instances..."

          sleep 15


# ============================================================
# 8. PRODUCTION HEALTH CHECK
# ============================================================

  production-health:

    name: "❤️ Production Health"

    needs: production

    runs-on: ubuntu-latest

    steps:

      - name: Health check

        run: |

          echo "======================================"
          echo "      PRODUCTION HEALTH CHECK"
          echo "======================================"


          # Replace with:
          #
          # curl --fail \
          # https://your-production-domain/health


          echo "HTTP health: OK"

          echo "Application health: OK"

          echo "Dependency health: OK"


      - name: Verify deployment version

        run: |

          echo "Expected version:"
          echo "${{ needs.build.outputs.version }}"


# ============================================================
# 9. POST DEPLOYMENT VERIFICATION
# ============================================================

  production-verification:

    name: "🔍 Production Verification"

    needs: production-health

    runs-on: ubuntu-latest

    steps:

      - name: Verify critical functionality

        run: |

          echo "Testing production functionality..."

          # Example:
          #
          # curl --fail \
          # https://your-production-domain/api/status


          echo "Critical functionality verified ✓"


      - name: Deployment completed

        run: |

          echo "======================================"

          echo "      DEPLOYMENT SUCCESSFUL 🚀"

          echo "======================================"


# ============================================================
# 10. PIPELINE SUMMARY
# ============================================================

  deployment-summary:

    name: "📊 Deployment Summary"

    needs:

      - build
      - beta
      - beta-tests
      - gamma
      - integration-tests
      - hydra-tests
      - production
      - production-health
      - production-verification

    if: always()

    runs-on: ubuntu-latest

    steps:

      - name: Generate deployment summary

        run: |

          echo ""
          echo "================================================"
          echo "          CORPORATE DEPLOYMENT SUMMARY"
          echo "================================================"

          echo ""

          echo "Application:"
          echo "${APP_NAME}"

          echo ""

          echo "Version:"
          echo "${{ needs.build.outputs.version }}"

          echo ""

          echo "Commit:"
          echo "${GITHUB_SHA}"

          echo ""

          echo "------------------------------------------------"
          echo "PIPELINE STATUS"
          echo "------------------------------------------------"

          echo ""

          echo "Build                 : ${{ needs.build.result }}"

          echo "Beta                  : ${{ needs.beta.result }}"

          echo "Beta Tests            : ${{ needs.beta-tests.result }}"

          echo "Gamma                 : ${{ needs.gamma.result }}"

          echo "Integration Tests     : ${{ needs.integration-tests.result }}"

          echo "Hydra Tests           : ${{ needs.hydra-tests.result }}"

          echo "Production            : ${{ needs.production.result }}"

          echo "Production Health     : ${{ needs.production-health.result }}"

          echo "Production Verify     : ${{ needs.production-verification.result }}"

          echo ""

          echo "================================================"
